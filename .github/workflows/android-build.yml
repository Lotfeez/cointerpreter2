name: Android Build

# Builds CoInterpreter's debug APK on a clean, GitHub-hosted runner. This is
# the designated compilation environment for this project: the development
# sandbox that authored this repository cannot reach the Android SDK /
# Google Maven / Gradle distribution servers, so this workflow (not a local
# build) is what actually produces CoInterpreter-debug.apk. See
# CI_BUILD_GUIDE.md for the two-minute version of how to use this.

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build, test, and lint the Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # actions/setup-java already caches ~/.gradle/caches and ~/.gradle/wrapper
      # keyed on **/*.gradle*, so no separate cache step is needed here.
      - name: Enable Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (JVM, app/src/test)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate, rename, and checksum the APK
        id: apk
        run: |
          set -euo pipefail
          SRC_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$SRC_APK" ]; then
            echo "No APK found under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          mkdir -p ../dist
          cp "$SRC_APK" ../dist/CoInterpreter-debug.apk
          SHA256=$(sha256sum ../dist/CoInterpreter-debug.apk | awk '{print $1}')
          SIZE=$(stat -c%s ../dist/CoInterpreter-debug.apk)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE" >> "$GITHUB_OUTPUT"
          echo "## CoInterpreter-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: android-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android-app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload CoInterpreter-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: CoInterpreter-debug.apk
          path: dist/CoInterpreter-debug.apk
          if-no-files-found: error
