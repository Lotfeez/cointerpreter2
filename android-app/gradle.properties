org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Base URL of the CoInterpreter backend that mints short-lived OpenAI Realtime
# credentials. Never point this at a URL that returns a permanent API key.
# Overridden per build-type in app/build.gradle.kts; can also be supplied via
# -PbackendBaseUrl=... on the command line or a local.properties entry.
COINTERPRETER_BACKEND_BASE_URL_DEBUG=http://10.0.2.2:8787/
COINTERPRETER_BACKEND_BASE_URL_RELEASE=https://your-cointerpreter-backend.example.com/
